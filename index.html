<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <title>WakeLab</title>
</head>
<body>
    <header class="bg-white border-b shadow-sm p-5">

        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">

            <h1 class="text-3xl font-bold text-gray-800">
                WakeLab
            </h1>

            <div class="flex flex-wrap items-center gap-3">

                <span id="user-name" class="font-medium">
                    Nom utilisateur
                </span>

                <button
                    id="btn-name"
                    type="button"
                    class="border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-100"
                >
                    Modifier nom
                </button>

                <button
                    id="btn-add"
                    type="button"
                    class="bg-gray-700 text-white px-4 py-2 rounded-lg hover:bg-gray-800"
                >
                    Nouvelle activite
                </button>

            </div>

        </div>

    </header>
</body>
</html>
